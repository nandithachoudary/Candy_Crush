<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Crush</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', sans-serif; color:#fff; min-height:100vh;
         background: linear-gradient(135deg,#ff6ec4,#7873f5 60%,#4ade80); }
  h1 { text-align:center; margin:16px 0 4px; text-shadow:0 2px 6px rgba(0,0,0,.3); }
  .sub { text-align:center; opacity:.9; margin-bottom:14px; }
  .wrap { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; padding:10px 16px 30px; }
  .card { background:rgba(0,0,0,.35); border-radius:16px; padding:16px; backdrop-filter: blur(4px); }
  #login { max-width:340px; margin:40px auto; text-align:center; }
  input { padding:10px; border-radius:8px; border:none; font-size:16px; width:70%; }
  button { padding:10px 18px; border-radius:8px; border:none; font-size:16px; cursor:pointer;
           background:#ffd93d; font-weight:bold; }
  #grid { display:grid; grid-template-columns:repeat(6,58px); gap:6px; }
  .tile { width:58px; height:58px; border-radius:12px; font-size:32px; display:flex; align-items:center;
          justify-content:center; cursor:pointer; user-select:none; transition: transform .15s, opacity .3s;
          box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .tile:hover { transform:scale(1.07); }
  .A{background:#e11d48}.B{background:#eab308}.C{background:#9333ea}.D{background:#16a34a}.E{background:#ec4899}
  .sel { outline:4px solid #fff; transform:scale(1.12); }
  .pop { animation: pop .55s forwards; }
  @keyframes pop { 50%{transform:scale(1.3); filter:brightness(1.6);} 100%{transform:scale(0); opacity:0;} }
  .shake { animation: shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  #score { font-size:24px; margin-bottom:8px; }
  #msg { min-height:24px; margin-top:8px; font-weight:bold; color:#ffe66d; }
  table { width:100%; border-collapse:collapse; }
  td { padding:4px 8px; } tr.me { background:rgba(255,255,255,.25); border-radius:6px; }
  .srv { display:flex; justify-content:space-between; padding:6px 10px; margin:4px 0; border-radius:8px; background:rgba(255,255,255,.12); }
  .badge { padding:1px 10px; border-radius:10px; font-size:13px; }
  .up{background:#16a34a}.down{background:#dc2626}
  .mine { outline:2px solid #ffd93d; }
  .side { width:260px; }
</style>
</head>
<body>
<h1>🍬 Candy Crush 🍬</h1>

<div id="login" class="card">
  <h3>Enter your name</h3>
  <input id="nameInput" maxlength="12" placeholder="Max length 12 characters">
  <button onclick="join()">Play</button>
  <div id="loginMsg" style="margin-top:10px;color:#ffe66d"></div>
</div>

<div id="game" class="wrap" style="display:none">
  <div class="card">
    <div id="score">Score: 0</div>
    <div id="grid"></div>
    <div id="msg">Click a candy, then click a neighbour to swap.</div>
    <button style="margin-top:10px" onclick="quit()">Quit</button>
  </div>
  <div class="side">
    <div class="card" style="margin-bottom:14px">
      <h3 style="margin-top:0">🏆 Leaderboard</h3>
      <table id="lb"></table>
    </div>
    <div class="card">
      <h3 style="margin-top:0">🖥️ Game Servers</h3>
      <div id="servers"></div>
    </div>
  </div>
</div>

<script>
const EMOJI = {A:'🍒', B:'🍋', C:'🍇', D:'🍏', E:'🍬'};
let name=null, board=[], score=0, selected=null, busy=false, myPort=null, pop=new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

async function api(path) { const r = await fetch(path, {method:'POST'}); return r.json(); }

async function join() {
  const n = $('nameInput').value.trim();
  const res = await api('/api/join?name=' + encodeURIComponent(n));
  if (!res.ok) { $('loginMsg').textContent = res.error; return; }
  name = n; board = res.board; score = res.score; myPort = res.server;
  $('login').style.display = 'none'; $('game').style.display = 'flex';
  render(); refreshSide(); setInterval(refreshSide, 2000);
}

function render() {
  $('score').textContent = 'Score: ' + score + (myPort ? '   (server :' + myPort + ')' : '');
  const g = $('grid'); g.innerHTML = '';
  for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
    const d = document.createElement('div');
    d.className = 'tile ' + board[r][c]
      + (selected && selected[0]===r && selected[1]===c ? ' sel' : '')
      + (pop.has(r+','+c) ? ' pop' : '');
    d.textContent = EMOJI[board[r][c]];
    d.onclick = () => clickTile(r, c);
    g.appendChild(d);
  }
}

function say(t) { $('msg').textContent = t; }

async function clickTile(r, c) {
  if (busy) return;
  if (!selected) { selected = [r,c]; render(); return; }
  const [pr, pc] = selected;
  if (pr===r && pc===c) { selected = null; render(); return; }
  if (Math.abs(pr-r) + Math.abs(pc-c) !== 1) { selected = [r,c]; render(); return; }
  selected = null; busy = true;
  const res = await api(`/api/move?name=${name}&r1=${pr}&c1=${pc}&r2=${r}&c2=${c}`);
  if (res.failover) {
    board = res.board; score = res.score; myPort = res.server; say(res.message); render();
  } else if (!res.ok) {
    say('❌ ' + res.error); $('grid').classList.add('shake');
    setTimeout(() => $('grid').classList.remove('shake'), 300); render();
  } else {
    myPort = res.server; board = res.swapped; pop = new Set(); render();
    let n = 1;
    for (const step of res.steps) {
      await sleep(500);
      pop = new Set(step.matched.map(m => m[0]+','+m[1])); render();
      say(`Pass ${n++}: cleared ${step.matched.length} candies  +${step.points}`);
      await sleep(600);
      pop = new Set(); board = step.board; score = step.score; render();
    }
    say(res.steps.length > 1 ? `🔥 Cascade of ${res.steps.length} passes!` : '✅ Nice match!');
  }
  busy = false; refreshSide();
}

async function refreshSide() {
  try {
    const lb = await (await fetch('/api/leaderboard?name=' + name)).json();
    $('lb').innerHTML = lb.players.map((p, i) =>
      `<tr class="${p.name===name?'me':''}"><td>${i+1}</td><td>${p.name}</td><td>${p.score}</td></tr>`).join('');
    const st = await (await fetch('/api/status')).json();
    $('servers').innerHTML = st.servers.map(s =>
      `<div class="srv ${s.port===myPort?'mine':''}"><span>:${s.port} (${s.players} players)</span>
       <span class="badge ${s.up?'up':'down'}">${s.up?'UP':'DOWN'}</span></div>`).join('');
  } catch (e) {}
}

function quit() { api('/api/leave?name=' + name).then(() => location.reload()); }
window.addEventListener('beforeunload', () => { if (name) navigator.sendBeacon('/api/leave?name=' + name); });
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
</script>
</body>
</html>
